# Seed Registry (RPF v2.0 CC.1.8)

**Project:** Paper 02 (*Critical Compositional Pressure & The Two-Subspace Law*)
**Purpose:** Single source of truth for random-seed provenance. All multi-seed runs derive seeds deterministically from this registry.

## Derivation Rule

- **Deterministic Seed Derivation Rule (Paper 01 / Paper 02 Convention, CC.1.2):**
  $$\text{seed} = \text{cell\_seed\_idx} \times 42 + 7$$
  where `cell_seed_idx` is the zero-based run index within an experimental cell/condition ($0 \dots 29$ for Tier 1 with $n=30$; $0 \dots 9$ for Tier 2 with $n=10$).
- **Global Identifier Disambiguation:**
  - `run_id`: Globally unique 1-based index across the 960-run production matrix ($1 \dots 960$).
  - `cell_seed_idx`: 0-based within-cell replicate index ($0 \dots 29$ for Tier 1; $0 \dots 9$ for Tier 2).
  - `seed`: Deterministic integer random seed passed to PyTorch, NumPy, Python `random`, and CUDA backends.

