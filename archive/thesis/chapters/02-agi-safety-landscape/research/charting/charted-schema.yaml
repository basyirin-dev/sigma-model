# Paper 01 (Scoping Review) — Phase 7 Finalized Charting Schema
# ------------------------------------------------------------------
# Canonical, machine-readable data-charting form (CC.1.5).
# Loaded by scripts under research/charting/ (config-driven, ADR 0004).
#
# Field attributes:
#   source        prefill = copied verbatim from Phase 6 artifacts
#                 heuristic = scripted vocabulary-matching extraction
#                 ai = free-text field filled by external AI pass (user-run)
#                 api = batched OpenAlex fetch
#   dual          [†] field: re-extracted on the 20% validation sample (CC.1.6)
#   multi         semicolon-separated controlled vocabulary (may list several)
#   conditional   only populated when the stated condition holds

schema_version: "1.0"
status: finalized
history:
  - "v1.0: mapped plan Task 7.1.2 fields onto Phase 0.5 extraction-template.md sections A-K; merged redundant fields; added evidence_basis audit column"

fields:
  - name: paper_id
    data_type: text
    required: true
    source: prefill
    description: "Study identifier P001-P1268 (from included-studies.csv study_id)"
  - name: title
    data_type: text
    required: true
    source: prefill
  - name: authors
    data_type: text
    required: true
    source: prefill
  - name: year
    data_type: integer
    required: true
    source: prefill
  - name: venue
    data_type: text
    required: true
    source: prefill
    description: "journal when present, else derived (arXiv preprint / DOI publisher)"
  - name: doi
    data_type: text
    required: false
    source: prefill
  - name: publication_type
    data_type: categorical-single
    required: true
    source: heuristic
    dual: true
    vocabulary: publication_type
  - name: subdomains
    data_type: categorical-multi
    required: true
    source: heuristic
    dual: true
    vocabulary: subdomains
  - name: formal_framework
    data_type: categorical-multi
    required: true
    source: heuristic
    dual: true
    vocabulary: formal_framework
    description: "none only when alone; multi-selection otherwise"
  - name: mathematical_formalism
    data_type: categorical-multi
    required: true
    source: heuristic
    dual: true
    vocabulary: mathematical_formalism
  - name: key_contribution
    data_type: long_text
    required: true
    source: ai
    dual: true
    description: "2-3 sentence summary of the central contribution/claim"
  - name: methodology
    data_type: categorical-single
    required: false
    source: heuristic
    dual: true
    vocabulary: methodology
    conditional: "publication_type == empirical"
  - name: discusses_internal_representations
    data_type: categorical-single
    required: true
    source: heuristic
    dual: true
    vocabulary: trinary
  - name: discusses_schema_coherence
    data_type: categorical-single
    required: true
    source: heuristic
    dual: true
    vocabulary: schema_coherence
  - name: relevance_sigma_trap
    data_type: integer
    required: true
    source: heuristic
    dual: true
    range: [1, 5]
    description: "seeded from annotations.csv relevance_score (Phase 6); AI pass may revise with justification"
  - name: relevance_justification
    data_type: long_text
    required: false
    source: ai
    description: "why the paper is/is not relevant to the sigma-trap thesis"
  - name: limitations_stated
    data_type: categorical-single
    required: true
    source: heuristic
    dual: true
    vocabulary: limitations
  - name: open_questions
    data_type: long_text
    required: false
    source: ai
    description: "open questions raised by the authors (free text, numbered)"
  - name: key_equations_definitions
    data_type: long_text
    required: false
    source: ai
    conditional: "formal_framework != none"
    description: "key equations or formal definitions quoted exactly (Task 7.2.4)"
  - name: datasets_used
    data_type: text
    required: false
    source: ai
    conditional: "methodology in [simulation, experiment, analysis]"
    description: "datasets/benchmarks used (Task 7.2.5)"
  - name: sample_size
    data_type: text
    required: false
    source: ai
    conditional: "methodology in [simulation, experiment, analysis]"
    description: "number of subjects/trials/models/seeds reported"
  - name: effect_sizes
    data_type: text
    required: false
    source: ai
    conditional: "methodology in [simulation, experiment, analysis]"
    description: "key quantitative results / effect sizes reported"
  - name: citation_count
    data_type: integer
    required: false
    source: api
    description: "OpenAlex cited_by_count at fetch date (quality weighting, optional)"
  - name: evidence_basis
    data_type: categorical-single
    required: true
    source: prefill
    vocabulary: evidence_basis
    description: "full-text = local PDF read; abstract = abstract used; metadata = neither"
  - name: notes
    data_type: long_text
    required: false
    source: heuristic
    description: "extractor free-text notes / coding caveats"

controlled_vocabularies:
  publication_type: [empirical, theoretical, review, position, opinion, technical report, other]
  subdomains: [value alignment, interpretability, robustness, mesa-optimization, governance, ethics, capabilities, other]
  formal_framework: [none, game theory, decision theory, dynamical systems, information theory, other]
  mathematical_formalism: [ODEs, probability, logic, optimization, none, other]
  methodology: [theory, simulation, experiment, analysis, case study, not_applicable]
  trinary: ["yes", "no", "implicitly"]
  schema_coherence: ["yes", "related concept", "no"]
  limitations: ["yes", "partially", "no"]
  evidence_basis: [full-text, abstract, metadata]

# Subdomain bucket mapping — finer concepts from Phase 0.5 template mapped
# onto the Task 7.1.2 controlled vocabulary (used by heuristic extractor).
subdomain_mapping:
  value alignment: [AI alignment, value alignment, inner alignment, outer alignment, corrigibility,
                   goal preservation, coherent extrapolated volition, indirect normativity,
                   reward modeling, RLHF, preference learning, human values]
  interpretability: [interpretab, explainab, transparency, mechanistic, circuits, features, probes,
                    attribution, concept-based]
  robustness: [robust, adversarial, out-of-distribution, OOD, distributional shift, formal verification,
              reward hacking, specification gaming, goal misgeneralization, safety properties,
              certified, worst-case]
  mesa-optimization: [mesa-optimization, mesa optimizer, deceptive alignment, inner alignment,
                    learned optimizer, optimizer]
  governance: [governance, policy, regulation, oversight, auditing, standards, treaty, legislation]
  ethics: [ethics, moral, fairness, bias, societal, human dignity, value pluralism, philosophical]
  capabilities: [capabilities, AGI progress, scaling, power-seeking, instrumental convergence,
                existential risk, transformative AI, superintelligence, x-risk]
  other: []

# Evidence-basis determination order: local PDF -> abstract (>100 chars) -> metadata.
