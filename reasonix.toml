[permissions]
allow = ["Bash(source hbar_env/bin/activate && python --version 2>&1)", "Bash(source hbar_env/bin/activate && pip list 2>/dev/null | grep -iE 'torch|ruff|pytest')", "Bash(source hbar_env/bin/activate && python --version && which python && ls -la hbar_env/bin/python* 2>&1)", "Bash(source hbar_env/bin/activate && python -c \"import sys; print(sys.version)\" 2>&1)", "Bash(source hbar_env/bin/activate && grep -n \"def main\" code/sigma_align/monitoring/evaluation.py 2>&1)", "Edit", "Bash(reasonix doctor capabilities --json 2>&1 | head -200)", "Bash(which arxiv-mcp-server academic-research-mcp zotero-mcp 2>&1; pip list 2>/dev/null | grep -iE 'arxiv|academic|zotero' 2>/dev/null; npm list -g 2>/dev/null | grep -iE 'arxiv|academic|zotero' 2>/dev/null; echo \"---\"; which uvx 2>/dev/null; which npx 2>/dev/null)", "install_source", "Bash(mkdir -p thesis/papers/02-systematic-review/research/search-results\ntouch thesis/papers/02-systematic-review/research/search-results/.gitkeep\necho \"Today is $(date +%Y-%m-%d), weekday=$(date +%A)\")", "Bash(SOURCE hbar_env/bin/activate 2>/dev/null; python3 -c \"\nimport json, datetime\n\n# Create the search results directory\nimport os\nos.makedirs('thesis/papers/02-systematic-review/research/search-results', exist_ok=True)\nprint('Directory ready')\nprint('Date:', datetime.date.today().isoformat())\n\")", "Bash(source hbar_env/bin/activate\n\n# arXiv Primary Search (P AND I/C AND O)\n# Using arXiv API: http://export.arxiv.org/api/query\n# Search query: ti:\"compositional generalization\" OR abs:\"compositional generalization\" OR ti:\"systematic generalization\" OR abs:\"out-of-distribution\" \n# AND abs:\"neural network\" OR abs:\"transformer\" OR abs:\"LSTM\"\n# AND abs:\"generalization failure\" OR abs:\"OOD accuracy\"\n\npython3 << 'PYEOF'\nimport urllib.request, urllib.parse, xml.etree.ElementTree as ET, json, time, datetime\n\nTODAY = datetime.date.today().isoformat()\nOUTDIR = \"thesis/papers/02-systematic-review/research/search-results\"\n\ndef query_arxiv(search_query, max_results=100):\n    \"\"\"Query arXiv API and return parsed entries.\"\"\"\n    params = urllib.parse.urlencode({\n        \"search_query\": search_query,\n        \"start\": 0,\n        \"max_results\": max_results,\n        \"sortBy\": \"relevance\",\n        \"sortOrder\": \"descending\"\n    })\n    url = f\"http://export.arxiv.org/api/query?{params}\"\n    req = urllib.request.Request(url, headers={\"User-Agent\": \"SigmaAlign/1.0\"})\n    resp = urllib.request.urlopen(req)\n    xml_data = resp.read().decode(\"utf-8\")\n    \n    ns = {\n        'atom': 'http://www.w3.org/2005/Atom',\n        'arxiv': 'http://arxiv.org/schemas/atom'\n    }\n    root = ET.fromstring(xml_data)\n    \n    entries = []\n    for entry in root.findall('atom:entry', ns):\n        paper = {\n            'arxiv_id': entry.find('atom:id', ns).text.split('/')[-1] if entry.find('atom:id', ns) is not None else '',\n            'title': entry.find('atom:title', ns).text.strip().replace('\\n', ' ') if entry.find('atom:title', ns) is not None else '',\n            'abstract': entry.find('atom:summary', ns).text.strip().replace('\\n', ' ') if entry.find('atom:summary', ns) is not None else '',\n            'published': entry.find('atom:published', ns).text if entry.find('atom:published', ns) is not None else '',\n            'updated': entry.find('atom:updated', ns).text if entry.find('atom:updated', ns) is not None else '',\n            'authors': [a.find('atom:name', ns).text for a in entry.findall('atom:author', ns)] if entry.findall('atom:author', ns) else [],\n            'categories': [c.get('term') for c in entry.findall('atom:category', ns)] if entry.findall('atom:category', ns) else [],\n            'primary_category': '',\n            'doi': '',\n            'arxiv_url': entry.find('atom:id', ns).text if entry.find('atom:id', ns) is not None else '',\n            'pdf_url': '',\n        }\n        # Get primary category\n        if entry.find('arxiv:primary_category', ns) is not None:\n            paper['primary_category'] = entry.find('arxiv:primary_category', ns).get('term', '')\n        elif paper['categories']:\n            paper['primary_category'] = paper['categories'][0]\n        \n        # Get doi from arXiv or links\n        for link in entry.findall('atom:link', ns):\n            if link.get('title') == 'doi':\n                paper['doi'] = link.get('href', '').replace('http://dx.doi.org/', '')\n            elif link.get('title') == 'pdf':\n                paper['pdf_url'] = link.get('href', '')\n        \n        entries.append(paper)\n    \n    total_results = root.find('atom:totalResults', ns)\n    total = int(total_results.text) if total_results is not None else len(entries)\n    \n    return entries, total\n\n# Define search queries per search-terms.md\nsearches = {\n    \"arxiv-primary\": {\n        \"query\": 'ti:\"compositional generalization\" OR ti:\"systematic generalization\" OR abs:\"compositional generalization\" OR abs:\"systematic generalization\" OR abs:\"out-of-distribution\" AND (abs:\"neural network\" OR abs:\"transformer\") AND (abs:\"generalization failure\" OR abs:\"OOD accuracy\" OR abs:\"generalization error\" OR abs:\"compositional accuracy\")',\n        \"description\": \"Primary search — P AND I/C AND O blocks\",\n        \"max_results\": 200\n    },\n    \"arxiv-safety\": {\n        \"query\": '(\"alignment\" OR \"mesa-optimization\" OR \"goal misgeneralization\" OR \"deceptive alignment\" OR \"reward hacking\" OR \"specification gaming\" OR \"inner misalignment\") AND abs:(\"neural network\" OR \"transformer\" OR \"deep learning\" OR \"LSTM\" OR \"RNN\")',\n        \"description\": \"Safety bridge — P AND I/C AND S blocks\",\n        \"max_results\": 200\n    },\n    \"arxiv-benchmark\": {\n        \"query\": '(\"SCAN\" OR \"COGS\" OR \"CFQ\" OR \"gSCAN\" OR \"PCFG-SET\" OR \"SQOOP\" OR \"CLOSURE\" OR \"SLOG\" OR \"CoFe\" OR \"GeoQuery\") AND (\"compositional generalization\" OR \"generalization failure\" OR \"compositional accuracy\" OR \"OOD accuracy\")',\n        \"description\": \"Benchmark-specific — P AND B AND O blocks\",\n        \"max_results\": 200\n    },\n    \"arxiv-broad\": {\n        \"query\": '(\"compositional generalization\" OR \"systematic generalization\" OR \"out-of-distribution\" OR \"shortcut learning\" OR \"spurious correlation\") AND (\"generalization failure\" OR \"representational structure\" OR \"loss landscape\" OR \"sharpness\" OR \"representational alignment\")',\n        \"description\": \"Broad search — I/C AND O blocks\",\n        \"max_results\": 200\n    }\n}\n\nresults_summary = []\nfor key, spec in searches.items():\n    print(f\"\\n=== {spec['description']} ===\")\n    entries, total = query_arxiv(spec['query'], spec['max_results'])\n    print(f\"Query returned {len(entries)} entries (total reported: {total})\")\n    \n    outfile = f\"{OUTDIR}/{key}-{TODAY}.json\"\n    with open(outfile, 'w') as f:\n        json.dump({\"query\": spec['query'], \"total_results\": total, \"returned\": len(entries), \"entries\": entries}, f, indent=2)\n    print(f\"Saved to {outfile}\")\n    \n    results_summary.append({\n        \"search\": key,\n        \"description\": spec['description'],\n        \"query\": spec['query'],\n        \"total_results\": total,\n        \"returned\": len(entries),\n        \"file\": outfile,\n        \"date\": TODAY\n    })\n    time.sleep(3)  # arXiv rate limit\n\n# Save summary\nsummary_file = f\"{OUTDIR}/search-summary-{TODAY}.json\"\nwith open(summary_file, 'w') as f:\n    json.dump(results_summary, f, indent=2)\nprint(f\"\\nSummary saved to {summary_file}\")\nPYEOF)", "Bash(source hbar_env/bin/activate\n\n# Save OpenAlex results from the MCP output into files\n# These were the OpenAlex primary and safety results that were printed above\n\nTODAY=\"2026-07-29\"\nOUTDIR=\"thesis/papers/02-systematic-review/research/search-results\"\n\necho \"Results will be assembled manually from the MCP server output.\"\necho \"Checking current contents of search-results:\"\nls -la \"$OUTDIR\"/*.json 2>/dev/null\n\n# Check the total result files\necho \"\"\necho \"Total JSON files: $(ls \"$OUTDIR\"/*.json 2>/dev/null | wc -l)\"\nwc -c \"$OUTDIR\"/*.json 2>/dev/null)", "Bash=cd /home/bigbasy/Documents/sigma-model && source hbar_env/bin/activate && python3 -c \"\n# Quick check: count records per file\nimport os\n\nbasedir = 'thesis/papers/01-scoping-review/research/search-results'\nfiles = sorted(os.listdir(basedir))\nprint(f'Total files: {len(files)}')\nprint()\n\n# Count RIS records\nfor fname in files:\n    path = os.path.join(basedir, fname)\n    size = os.path.getsize(path)\n    if fname.endswith('.ris'):\n        count = 0\n        with open(path, 'r') as f:\n            for line in f:\n                if line.startswith('ER  -'):\n                    count += 1\n        print(f'{fname:45s} {size:>10,} bytes  {count:>5} records')\n    elif fname.endswith('.enw'):\n        count = 0\n        with open(path, 'r') as f:\n            for line in f:\n                if line.startswith('%0 '):\n                    count += 1\n        print(f'{fname:45s} {size:>10,} bytes  {count:>5} records')\n    elif fname.endswith('.json'):\n        import json\n        with open(path) as f:\n            data = json.load(f)\n        if 'entries' in data:\n            count = len(data['entries'])\n        elif 'papers' in data:\n            count = len(data['papers'])\n        elif 'count' in data:\n            count = data['count']\n        else:\n            count = len(data)\n        print(f'{fname:45s} {size:>10,} bytes  {count:>5} records')\n    else:\n        print(f'{fname:45s} {size:>10,} bytes')\n\"", "Bash=cd /home/bigbasy/Documents/sigma-model && source hbar_env/bin/activate && python3 thesis/papers/01-scoping-review/phases/04_deduplication.py 2>&1"]

