# Paper 01 — Phase 7 heuristic extraction config (ADR 0004: config-driven).
# Keyword sets are regex patterns matched (lowercased, word-boundary) against
# evidence text: full text (first 4 pages) when available, else abstract.
# Loaded by research/charting/heuristic.py.

# publication_type decision: check buckets in this priority order; first
# bucket with a hit wins (review-major titles trump empirical hits).
publication_type:
  review:
    - \bsurvey(s| of| on)?\b
    - \breview(s)?\b
    - \bstate of the art\b
    - \bscoping (review|study)\b
    - \bmeta-?analysis\b
    - \bliterature (review|survey)\b
    - \btaxonomy\b
    - \bmapping (of|the)?\b
  empirical:
    - \bwe (evaluate|train|test|conduct|collect|measure|analyze)\b
    - \bempiric(al|ally)?\b
    - \bexperiment(s|al|ally)?\b
    - \bbenchmark(s|ing)?\b
    - \bdatasets?\b
    - \bresults? show\b
    - \bcase stud(y|ies)\b
    - \buser stud(y|ies)\b
    - \bsimulation(s)?\b
    - \bfine[- ]tun(e|ing|ed)\b
  theoretical:
    - \btheorem(s)?\b
    - \bproof(s)?\b
    - \bproposition(s)?\b
    - \bformal (framework|model|definition|characterization|analysis)\b
    - \bmathematical (framework|model|formulation)\b
    - \baxiom(s|atic)?\b
    - \bprovable?\b
    - \bformaliz(ed|ation)?\b
  position:
    - \bwe argue\b
    - \bposition paper\b
    - \bwe claim\b
    - \bthis paper argues\b
    - \bwe (propose|advocate) that\b
  opinion:
    - \bopinion (paper|piece)?\b
    - \bcommentary\b
    - \bviewpoint\b
    - \bperspective (paper|piece)?\b
    - \beditorial\b
  technical_report:
    - \btechnical report\b
    - \bwhite paper\b
    - \bposition statement\b

