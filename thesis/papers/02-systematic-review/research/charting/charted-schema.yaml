# ------------------------------------------------------------------
# Controlled vocabularies — template section 2 codebook (+ phase doc 7.1.2)
# ------------------------------------------------------------------
vocabularies:
  boolean: ["TRUE", "FALSE"]
  pub_type: [empirical, theoretical, review, position, dataset_benchmark, survey_ma, other]
  pub_venue_type: [journal, conference, workshop, preprint, tech_report, thesis, other]
  task: [SCAN, COGS, CFQ, PCFG_SET, gSCAN, CREAK, GeoQuery, WILDS, PACS, OfficeHome, VLCS,
         TerraIncognita, DomainNet, ImageNet_C, ImageNet_R, ImageNet_A, Camelyon17, FMoW,
         PovertyMap, CivilComments, MNIST, CIFAR10, CIFAR100, ImageNet, ColoredMNIST,
         Waterbirds, CelebA, MultiNLI, HANS, BBQ, custom, other]
  ood_split_type: [compositional, covariate_shift, concept_shift, label_shift, domain_shift,
                   adversarial, temporal, none, mixed]
  arch_primary: [LSTM, GRU, VanillaRNN, TransformerEnc, TransformerDec, TransformerEncDec,
                 BERT, GPT, T5, ResNet, DenseNet, ConvNeXt, ViT, Swin, MLP, MLPMixer, GCN,
                 GAT, NeuralSymbolic, ODE, Diffusion, other]
  arch_family: [rnn_family, transformer, cnn_family, vit, mlp, gnn, neurosymbolic, ode,
                diffusion, other]
  model_scale_category: [small, medium, large, xl, unspecified]
  train_regime: [standard_SGD, standard_Adam, momentum, curriculum, augmentation, multi_task,
                 meta_learning, sigma_coupled, contrastive, invariant_learning,
                 adversarial_train, regularized, other]
  train_regime_sigma: [SAM, ASAM, Friendly-SAM, Tilted-SAM, SWAD, entropy-SGD, MESA,
                       other_sigma, not_applicable]
  baseline_regime: [standard_SGD, standard_Adam, other]
  metric_type: [accuracy, F1, AUC, BLEU, exact_match, other]
  effect_size_type: [log_odds_ratio, hedges_g, cohens_d, raw_delta, none, other]
  schema_coherence_proxy: [linear_probe_acc, CKA, RSA, effective_rank, disentanglement_metric,
                           mutual_info, causal_probe_acc, logical_consistency,
                           compositionality_score, feature_sparsity, cluster_purity,
                           attention_entropy, neuron_monosemanticity, other]
  repr_analysis: [probing, RSA, CKA, clustering, PCA, SAE, attention_patterns, CAV,
                  activation_max, none, other]
  sig_test_type: [t-test, wilcoxon, bootstrap, permutation, friedman, ANOVA, other, none]
  multiple_testing_correction: [bonferroni, holm, BH, none, other, unclear]
  data_leakage_check: [explicit_no, not_addressed, suspected, confirmed_yes]
  reproducibility_score: [high, medium, low, partial]

# ------------------------------------------------------------------
# Cross-field validation rules — template section 4.1 (V01-V20)
# ------------------------------------------------------------------
validation_rules:
  - id: V01
    fields: [id_acc_mean, id_acc_n_test]
    rule: "if id_acc_mean present, id_acc_n_test should be present"
    severity: warning
  - id: V02
    fields: [ood_acc_mean, ood_acc_n_test]
    rule: "if ood_acc_mean present, ood_acc_n_test should be present"
    severity: warning
  - id: V03
    fields: [id_acc_sd, id_acc_n_seeds]
    rule: "if id_acc_sd present, id_acc_n_seeds >= 2"
    severity: error
  - id: V04
    fields: [ood_acc_sd, ood_acc_n_seeds]
    rule: "if ood_acc_sd present, ood_acc_n_seeds >= 2"
    severity: error
  - id: V05
    fields: [id_ood_gap_raw]
    rule: "id_ood_gap_raw == id_acc_mean - ood_acc_mean (+-0.001)"
    severity: error
  - id: V06
    fields: [effect_size_type, effect_size_value]
    rule: "if effect_size_type != none, effect_size_value must be present"
    severity: error
  - id: V07
    fields: [train_regime, train_regime_sigma]
    rule: "if train_regime == sigma_coupled, train_regime_sigma != not_applicable"
    severity: error
  - id: V08
    fields: [schema_coherence_measured, schema_coherence_proxy]
    rule: "if schema_coherence_measured == TRUE, schema_coherence_proxy must be present"
    severity: error
  - id: V09
    fields: [n_seeds_reported, n_seeds_value]
    rule: "if n_seeds_reported == TRUE, n_seeds_value >= 1"
    severity: error
  - id: V10
    fields: [sig_test_reported, sig_test_type]
    rule: "if sig_test_reported == TRUE, sig_test_type != none"
    severity: error
  - id: V11
    fields: [code_available, code_url]
    rule: "if code_available == TRUE, code_url should be present"
    severity: warning
  - id: V12
    fields: [data_available, data_url]
    rule: "if data_available == TRUE, data_url should be present"
    severity: warning
  - id: V13
    fields: [relevance_sigma_trap, relevance_sigma_justification]
    rule: "if relevance_sigma_trap >= 4, justification >= 100 chars"
    severity: error
  - id: V14
    fields: [relevance_alignment, relevance_alignment_justification]
    rule: "if relevance_alignment >= 4, justification >= 100 chars"
    severity: error
  - id: V15
    fields: [ood_split_type, ood_acc_mean]
    rule: "if ood_split_type == none, ood results fields should be empty"
    severity: error
  - id: V16
    fields: [id_metric_type, ood_metric_type]
    rule: "id_metric_type and ood_metric_type should match for gap calculation"
    severity: warning
  - id: V17
    fields: [effect_size_computed_by_extractor, effect_size_notes]
    rule: "if effect_size_computed_by_extractor == TRUE, effect_size_notes should explain derivation"
    severity: warning
  - id: V18
    fields: [pub_type, limitations_stated]
    rule: "if pub_type == review, limitations_stated may be FALSE (info only)"
    severity: info
  - id: V19
    fields: [param_count, model_scale_category]
    rule: "model_scale_category should be consistent with param_count"
    severity: warning
  - id: V20
    fields: [train_regime_sigma]
    rule: "if train_regime_sigma == SAM, check rho (perturbation radius) in notes"
    severity: warning

# ------------------------------------------------------------------
# Export contract — template section 7
# ------------------------------------------------------------------
export:
  csv_long: research/charted-data.csv          # one row per study x split x arch x intervention
  csv_main: research/charted-data-main.csv     # one row per study (main form only)
  json: research/charted-data.json             # nested: study -> sub_experiments
