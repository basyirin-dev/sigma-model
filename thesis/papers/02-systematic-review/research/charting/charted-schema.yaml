# Paper 02 (Systematic Review — σ-Trap) — Phase 7 Finalized Charting Schema
# ------------------------------------------------------------------
# Canonical, machine-readable data-extraction form (Task 7.1, CC.1.5).
# Loaded by scripts under research/charting/ (config-driven, ADR 0004).
# Reconciled from research/extraction-template.md (Phase 0.5, status: Finalized)
# against Phase 7 task doc 7.1.2 field list (thesis/papers/02-systematic-review/phases/07_data_extraction.md).
#
# Field attributes:
#   source        prefill    = copied verbatim from Phase 6 artifacts (included-studies.csv)
#                 hint       = candidate value seeded from study-characteristics.csv (Phase 6.5.1);
#                              the AI pass must confirm or correct from full text (flag if changed)
#                 ai         = field filled by the external AI pass from full-text excerpts
#                 calculated = derived from other fields (never filled by AI)
#   dual          [†] field: re-extracted by the independent second extractor on the
#                 20% validation sample (Task 7.3, CC.1.6) and compared via kappa/ICC
#   conditional   only populated when the stated condition holds
#
# Reconciliations vs template (logged in history):
#   R1  paper_id (P001-P999) -> study_id (S001-S286) from included-studies.csv;
#       internal P02_XXXX key kept as field `id` (joins full-text-txt/).
#   R2  Template §1B pub_type = STUDY DESIGN type (empirical/theoretical/...).
#       Phase doc 7.1.2 publication-type list (journal/conference/preprint/...) is a
#       DISTINCT axis -> new field pub_venue_type, prefilled heuristically from venue.
#   R3  Phase doc "OOD difficulty metric reported?" -> new fields
#       ood_difficulty_metric (bool) + ood_difficulty_metric_name.
#   R4  Phase doc "Any other metrics reported (F1, precision, ...)" -> new field
#       other_metrics_reported (free text).
#   R5  Long-format export carries template §3 sub-experiment rows keyed by
#       sub_exp_id = {study_id}_E{NN}; split_id / arch_id / intervention_id
#       implement Tasks 7.2.4-7.2.6 (one row per study x split x arch x intervention).

schema_version: "1.1"
status: finalized
history:
  - "v1.0: mapped Phase 7 doc 7.1.2 fields onto Phase 0.5 extraction-template.md sections 1A-1Q + 3; adopted study_id S001-S286 (R1); split pub_type vs pub_venue_type (R2); added ood_difficulty_metric, other_metrics_reported (R3,R4); long-format sub-experiment contract per template section 3 (R5)"
  - "v1.1 (validation refinement, Task 7.3.4): codebook rules added for fields with systematic extractor disagreement — (R-A) task_primary: 'custom' wins over 'other' when task_custom_name is populated; (R-B) model_scale_category: derived from param_count when present, else unspecified; (R-C) multiple_testing_correction: 'unclear' maps to 'none' when no significance test reported (silent papers); (R-D) metric_type: code exact_match only when the paper literally reports exact-match accuracy, else accuracy; (R-E) ood_split_type: apply template section 5.4 decision tree, adjudicating against full text"

key_fields:
  - study_id      # S001-S286 (primary key, joins included-studies.csv)
  - id            # P02_XXXX internal key (joins full-text-txt/)
  - split_id      # OOD-split instance within study (7.2.4); "default" when single
  - arch_id       # architecture instance within study (7.2.5); "default" when single
  - intervention_id  # intervention-vs-baseline instance (7.2.6); "default" when single
  - sub_exp_id    # {study_id}_E{NN} per template section 3 (S1)

# ------------------------------------------------------------------
# Study-level (main form) fields — template sections 1A-1Q
# ------------------------------------------------------------------
study_fields:
  # --- 1A Bibliographic ---
  - name: study_id
    data_type: text
    required: true
    source: prefill
    description: "S001-S286 (included-studies.csv study_id)"
  - name: id
    data_type: text
    required: true
    source: prefill
    description: "P02_XXXX internal key"
  - name: title
    data_type: text
    required: true
    source: prefill
  - name: authors
    data_type: text
    required: true
    source: prefill
  - name: year
    data_type: integer
    required: true
    source: prefill
    range: [1990, 2026]
  - name: venue
    data_type: text
    required: true
    source: prefill
    description: "journal or conference name; 'arXiv preprint' when unreviewed"
  - name: doi
    data_type: text
    required: false
    source: prefill
  - name: arxiv_id
    data_type: text
    required: false
    source: prefill
  - name: peer_reviewed
    data_type: categorical-single
    required: true
    source: ai
    dual: true
    vocabulary: boolean
    description: "prefilled from venue/source_db; CONFIRM from full text — arXiv-coded records are often peer-reviewed (pilot finding)"
  # --- 1B Publication type ---
  - name: pub_type
    data_type: categorical-single
    required: true
    source: ai
    dual: true
    vocabulary: pub_type
    description: "STUDY DESIGN type (empirical/theoretical/review/...); distinct from pub_venue_type"
  - name: pub_type_other
    data_type: text
    required: false
    source: ai
    dual: true
    conditional: "pub_type == other"
  - name: pub_venue_type
    data_type: categorical-single
    required: true
    source: ai
    dual: true
    vocabulary: pub_venue_type
    description: "R2: publication venue category; prefilled heuristically from venue — CONFIRM from full text"
  # --- 1C Task & benchmark ---
  - name: task_primary
    data_type: categorical-single
    required: true
    source: ai
    dual: true
    vocabulary: task
    description: "seeded from study-characteristics.csv benchmarks hint; confirm/correct from full text"
  - name: tasks_secondary
    data_type: categorical-multi
    required: false
    source: ai
    dual: true
    vocabulary: task
  - name: task_custom_name
    data_type: text
    required: false
    source: ai
    dual: true
    conditional: "task_primary == custom"
  - name: ood_split_type
    data_type: categorical-single
    required: true
    source: ai
    dual: true
    vocabulary: ood_split_type
    description: "use section 5.4 decision tree of the template"
  - name: ood_difficulty_metric
    data_type: categorical-single
    required: true
    source: ai
    dual: true
    vocabulary: boolean
    description: "R3: does the paper report an OOD difficulty metric (e.g., compound divergence)?"
  - name: ood_difficulty_metric_name
    data_type: text
    required: false
    source: ai
    dual: true
    conditional: "ood_difficulty_metric == TRUE"
  # --- 1D Model architecture ---
  - name: arch_primary
    data_type: categorical-single
    required: true
    source: ai
    dual: true
    vocabulary: arch_primary
    description: "seeded from study-characteristics.csv architectures hint; confirm/correct from full text"
  - name: arch_family
    data_type: categorical-single
    required: true
    source: ai
    dual: true
    vocabulary: arch_family
  - name: arch_detail
    data_type: text
    required: false
    source: ai
    dual: true
    description: "free text, e.g. '6-layer Transformer, 8 heads' (<=200 chars)"
  # --- 1E Model scale ---
  - name: param_count
    data_type: integer
    required: false
    source: ai
    dual: true
    range: [1, 1000000000000]
  - name: n_layers
    data_type: integer
    required: false
    source: ai
    dual: true
    range: [1, 1000]
  - name: hidden_dim
    data_type: integer
    required: false
    source: ai
    dual: true
    range: [1, 1000000]
  - name: model_scale_category
    data_type: categorical-single
    required: true
    source: ai
    dual: true
    vocabulary: model_scale_category
    description: "small <1M; medium 1M-100M; large 100M-10B; xl >10B; unspecified"
  # --- 1F Training data ---
  - name: train_n_examples
    data_type: integer
    required: false
    source: ai
    dual: true
    range: [1, 1000000000000]
  - name: train_n_tokens
    data_type: integer
    required: false
    source: ai
    dual: true
    range: [1, 1000000000000000]
  - name: train_data_note
    data_type: text
    required: false
    source: ai
    dual: true
    description: "free text (<=200 chars)"
  # --- 1G Training regime ---
  - name: train_regime
    data_type: categorical-single
    required: true
    source: ai
    dual: true
    vocabulary: train_regime
  - name: train_regime_sigma
    data_type: categorical-single
    required: false
    source: ai
    dual: true
    vocabulary: train_regime_sigma
    conditional: "train_regime == sigma_coupled"
  - name: train_regime_other
    data_type: text
    required: false
    source: ai
    dual: true
    conditional: "train_regime == other"
  - name: baseline_regime
    data_type: categorical-single
    required: true
    source: ai
    dual: true
    vocabulary: baseline_regime
  - name: augmentation_used
    data_type: categorical-single
    required: true
    source: ai
    dual: true
    vocabulary: boolean
  - name: augmentation_type
    data_type: text
    required: false
    source: ai
    dual: true
    conditional: "augmentation_used == TRUE"
  - name: curriculum_used
    data_type: categorical-single
    required: true
    source: ai
    dual: true
    vocabulary: boolean
  - name: meta_learning_used
    data_type: categorical-single
    required: true
    source: ai
    dual: true
    vocabulary: boolean
  # --- 1H ID results ---
  - name: id_acc_mean
    data_type: numeric
    required: false
    source: ai
    dual: true
    range: [0.0, 1.0]
    description: "proportion 0-1 (convert percentages)"
  - name: id_acc_sd
    data_type: numeric
    required: false
    source: ai
    dual: true
    range: [0.0, 1.0]
  - name: id_acc_n_seeds
    data_type: integer
    required: false
    source: ai
    dual: true
    range: [1, 1000]
  - name: id_acc_n_test
    data_type: integer
    required: false
    source: ai
    dual: true
    range: [1, 1000000000000]
  - name: id_acc_ci_lower
    data_type: numeric
    required: false
    source: ai
    dual: true
    range: [0.0, 1.0]
  - name: id_acc_ci_upper
    data_type: numeric
    required: false
    source: ai
    dual: true
    range: [0.0, 1.0]
  - name: id_metric_type
    data_type: categorical-single
    required: true
    source: ai
    dual: true
    vocabulary: metric_type
  - name: id_metric_other
    data_type: text
    required: false
    source: ai
    dual: true
    conditional: "id_metric_type == other"
  # --- 1I OOD results ---
  - name: ood_acc_mean
    data_type: numeric
    required: false
    source: ai
    dual: true
    range: [0.0, 1.0]
  - name: ood_acc_sd
    data_type: numeric
    required: false
    source: ai
    dual: true
    range: [0.0, 1.0]
  - name: ood_acc_n_seeds
    data_type: integer
    required: false
    source: ai
    dual: true
    range: [1, 1000]
  - name: ood_acc_n_test
    data_type: integer
    required: false
    source: ai
    dual: true
    range: [1, 1000000000000]
  - name: ood_acc_ci_lower
    data_type: numeric
    required: false
    source: ai
    dual: true
    range: [0.0, 1.0]
  - name: ood_acc_ci_upper
    data_type: numeric
    required: false
    source: ai
    dual: true
    range: [0.0, 1.0]
  - name: ood_metric_type
    data_type: categorical-single
    required: true
    source: ai
    dual: true
    vocabulary: metric_type
  - name: ood_metric_other
    data_type: text
    required: false
    source: ai
    dual: true
    conditional: "ood_metric_type == other"
  # --- 1J ID-OOD gap (calculated) ---
  - name: id_ood_gap_raw
    data_type: numeric
    required: false
    source: calculated
    description: "id_acc_mean - ood_acc_mean (auto)"
  - name: id_ood_gap_se
    data_type: numeric
    required: false
    source: calculated
    description: "sqrt(sd_id^2/n_id + sd_ood^2/n_ood) (auto)"
  - name: id_ood_gap_reported
    data_type: numeric
    required: false
    source: ai
    dual: true
    description: "gap value if the paper reports it directly"
  # --- 1K Effect size ---
  - name: effect_size_type
    data_type: categorical-single
    required: true
    source: ai
    dual: true
    vocabulary: effect_size_type
  - name: effect_size_value
    data_type: numeric
    required: false
    source: ai
    dual: true
    conditional: "effect_size_type != none"
  - name: effect_size_se
    data_type: numeric
    required: false
    source: ai
    dual: true
