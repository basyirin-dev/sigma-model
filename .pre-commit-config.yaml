# Pre-commit hooks — run `pre-commit install` to activate.
# Enforces formatting, whitespace, YAML/TOML/JSON validity, and Ruff linting.
exclude: |
  (?x)(
    ^archive/|
    ^paper/submission_.*|
    ^paper/notebooks/|
    ^.*\.ipynb$
  )
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=2048]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        args: [--fix]
        types_or: [python, pyi]
