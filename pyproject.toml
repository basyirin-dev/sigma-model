[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sigma-align"
version = "1.0.0"
description = "Σ-Align — Schema Coherence Framework for AI Alignment and AGI Safety"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "[Anonymous]" },
]

dependencies = [
    "numpy>=2.0,<3.0",
    "scipy>=1.14,<2.0",
    "torch>=2.10,<3.0",
    "pyyaml>=6.0,<7.0",
    "tqdm>=4.60,<5.0",
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<1.0",
    "pandas>=2.0,<3.0",
    "pyarrow>=14,<25",
    "triton>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "pre-commit>=3.5",
    "pip-audit>=2.10",
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
]
viz = [
    "plotly>=5.18,<6.0",
    "kaleido>=0.2.1,<1.0",
]

[project.scripts]
sigma-evaluate = "sigma_align.monitoring.evaluation:main"

[tool.setuptools.packages.find]
where = ["code"]
include = ["sigma_align*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = []
