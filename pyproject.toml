[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sigma-align"
version = "1.0.0"
description = "The Σ-Model: A Dynamical-Systems Framework for Compositional Generalization and Schema-Coherence Suppression"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Basyirin Amsyar Basri" },
]

dependencies = [
    "numpy>=1.24,<3.0",
    "scipy>=1.10,<2.0",
    "torch>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "tqdm>=4.60,<5.0",
    "matplotlib>=3.7,<4.0",
    "seaborn>=0.12,<1.0",
    "pandas>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
sigma-evaluate = "sigma_align.monitoring.evaluation:main"

[tool.setuptools.packages.find]
where = ["code"]
include = ["sigma_align*"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*.ipynb", "archive/*", "paper/notebooks/*", "paper/submission_*/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]
"paper/tests/*" = ["F401", "F811"]
"code/experiments/*" = ["E402"]


[tool.pytest.ini_options]
testpaths = ["tests", "paper/tests"]
python_files = ["test_*.py"]


[tool.coverage.run]
source = ["paper/src", "code/sigma_align"]
omit = [
    "*/test_*",
    "*/tests/*",
    "*/experiments/*",
]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
]
show_missing = true

